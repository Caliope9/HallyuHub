name: Flutter Android Release

on:
  push:
    branches:
      - codex/flutter-migration
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Validate required secrets
        env:
          HALLYUHUB_SUPABASE_URL: ${{ secrets.HALLYUHUB_SUPABASE_URL }}
          HALLYUHUB_SUPABASE_ANON_KEY: ${{ secrets.HALLYUHUB_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${HALLYUHUB_SUPABASE_URL:?Missing HALLYUHUB_SUPABASE_URL secret}"
          : "${HALLYUHUB_SUPABASE_ANON_KEY:?Missing HALLYUHUB_SUPABASE_ANON_KEY secret}"
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/hallyuhub-upload-key-v2.jks
          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=hallyuhub-upload-key-v2.jks\n'
          } > android/key.properties
          test -s android/hallyuhub-upload-key-v2.jks
          test -s android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed Android App Bundle
        env:
          HALLYUHUB_SUPABASE_URL: ${{ secrets.HALLYUHUB_SUPABASE_URL }}
          HALLYUHUB_SUPABASE_ANON_KEY: ${{ secrets.HALLYUHUB_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define="HALLYUHUB_SUPABASE_URL=${HALLYUHUB_SUPABASE_URL}" \
            --dart-define="HALLYUHUB_SUPABASE_ANON_KEY=${HALLYUHUB_SUPABASE_ANON_KEY}"
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyuhub-android-release
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties android/hallyuhub-upload-key-v2.jks
